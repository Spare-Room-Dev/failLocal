# The model Pilbara iron ore site. Fictional: not any company's site.
# Every judgement and assumed number here has an entry in docs/decisions.md (D-nnn).
schemaVersion: 1

site:
  id: pilbara-model-site
  name: Model Pilbara iron ore site (fictional)
  fictional: true
  description: >-
    A fictional, mid-size iron ore mine in the Pilbara, Western Australia, built to show what stops
    when an outside service disappears. Model assumption: the haul fleet is autonomous (AHS),
    supervised from a Perth remote operations centre. Trains load at the site and are controlled
    from Perth with local fallback. Distances are compressed to model scale. Real companies appear
    only as public sources for the scenarios.

