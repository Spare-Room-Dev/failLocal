  - id: s3-vendor-setpoint
    title: Vendor changes a crusher setting out of hours
    summary: >-
      At 2 am a change to the crusher's control settings arrives through vendor A's remote access.
      Unprepared, nobody notices and the crusher trips. Prepared, monitoring flags it and vendor A's
      access is cut, while vendor B stays connected. Claroty's mining survey found 76% of respondents
      had attacks originate from third-party supplier access; MM-ISAC asks for vendor access to be
      "brokered, named and temporary".
    basis: [claroty-mining-survey, mmisac-ref-arch]
    projection: false
    workaroundsHold: false
    horizon:
      value: 2
      unit: days
      provenance: { kind: assumed, reasoning: 'The outage plus recovery (D-085).' }
    events:
      - kind: compromise
        via: vendor-a-access
        target: crusher-plc
        at:
          value: 2
          unit: hours
          provenance: { kind: assumed, reasoning: '2 am, out of hours (D-083).' }
        downFor:
          value: 12
          unit: hours
          provenance: { kind: assumed, reasoning: 'Find the cause, restore known-good settings and recommission: about a shift (D-084).' }

  - id: s4-precautionary-isolation
    title: Precautionary isolation from the corporate network
    summary: >-
      After ransomware on the corporate side, the site is cut off from the corporate network as a
      precaution for five days, which also cuts the hosted ERP, cloud logins and the Perth link. The
      length comes from Copper Mountain, December 2022, which shut its mill as a precaution after an
      IT ransomware attack and restarted its primary crusher five days later. Copper Mountain kept
      shipping from inventory throughout; the model site's three-day stockpile does not stretch that
      far, so its trains run short before the isolation ends. Waterfall's 2025 report
      found that, where the attack pattern could be determined, nearly 90% of 2024 attacks with
      physical consequences caused them indirectly, as here.
    basis: [kitco-copper-mountain, record-copper-mountain, waterfall-2025]
    projection: false
    workaroundsHold: false
    horizon:
      value: 8
      unit: days
      provenance: { kind: assumed, reasoning: 'Copper Mountain''s mill was back at full production eight days after the attack (D-087).' }
    events:
      - kind: cut-service
        service: corporate-network
        at:
          value: 0
          unit: hours
          provenance: { kind: assumed, reasoning: 'The timeline starts at the cut (D-087).' }
        restoreAfter:
          value: 120
          unit: hours
          provenance: { kind: assumed, reasoning: 'Proxy for the isolation length: Copper Mountain''s primary crusher restarted five days after the 27 December 2022 attack (Kitco, kitco-copper-mountain). The source measures the crusher shutdown, not an isolation (D-086).' }

