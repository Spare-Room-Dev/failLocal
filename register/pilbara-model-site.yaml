      unit: days
      provenance: { kind: assumed, reasoning: 'A running site keeps its fuel topped up (D-056).' }
    lowThreshold:
      value: 2
      unit: days
      provenance: { kind: assumed, reasoning: 'Below two days fuel is rationed and the fleet slows (D-057).' }
    refillRate:
