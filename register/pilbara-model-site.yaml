controls:
  - id: offline-ordering
    name: Offline emergency ordering
    description: >-
      Approved suppliers, specifications, lead times and authority to place emergency orders kept on
      site, with offline order numbering and a way to reconcile the orders once the ERP is back.
    effects:
      - { kind: fallback, process: diesel-ordering, service: hosted-erp }
      - { kind: fallback, process: explosives-ordering, service: hosted-erp }
    capability:
      works: true
      provenance: { kind: assumed, reasoning: 'Not yet exercised; the lab will test it (D-007).' }
      measurements: []
  - id: offline-work-orders
    name: Offline work orders
    description: A site work-order app with open and planned work, parts locations and history, synced back to the ERP later.
    effects:
      - { kind: fallback, process: work-orders, service: hosted-erp }
    assets: [offline-wo-app]
    capability:
      works: true
      provenance: { kind: assumed, reasoning: 'Not yet exercised; the lab will test it (D-007).' }
      measurements: []
  - id: payroll-continuity
    name: Payroll continuity
    description: The last pay run is reused so staff are paid on time; differences are corrected in the next run.
    effects:
      - { kind: fallback, process: payroll, service: hosted-erp }
    capability:
      works: true
      provenance: { kind: assumed, reasoning: 'Not yet exercised (D-007).' }
      measurements: []
  - id: independent-erp-restore
    name: Independent ERP restore
    description: >-
      The site keeps its own tested backup of the ERP and can bring it back on standby hardware,
      without waiting for the hosting provider.
    effects:
      - kind: restore
        service: hosted-erp
        duration:
          value: 48
          unit: hours
          provenance: { kind: assumed, reasoning: 'Two days to restore from the site''s own backup and check the data. A modelled time, not a lab timing (D-072).' }
    capability:
      works: true
      provenance: { kind: assumed, reasoning: 'Not yet tested; the lab will restore a mock ERP (D-007).' }
      measurements: []
  - id: site-authority
    name: Site takes over from Perth
    description: >-
      A tested procedure hands control of the fleet and trains to trained site controllers when the
      Perth link is lost, with only one authority active at a time.
    effects:
      - kind: fallback
        process: remote-operations
        service: iroc-link
        delay:
          value: 2
          unit: hours
          provenance: { kind: assumed, reasoning: 'Time for site controllers to reach the console, confirm the fleet and take authority (D-073).' }
    capability:
      works: true
      provenance: { kind: assumed, reasoning: 'Not yet exercised; the lab will test the handover (D-007).' }
      measurements: []
  - id: local-identity
    name: Local logins
    description: A site login server lets control-room operators log on when the cloud logins are unavailable.
    effects:
      - { kind: fallback, process: control-room, service: cloud-identity }
    assets: [site-identity]
    capability:
      works: true
      provenance: { kind: assumed, reasoning: 'Not yet exercised; the lab will test it (D-007).' }
      measurements: []
  - id: vendor-monitoring
    name: Vendor session monitoring
    description: >-
      Vendor sessions go through the site jump host and are watched. An unexpected change to plant
      control is flagged, and that vendor's access is cut while other vendors stay connected.
    effects:
      - kind: detect-and-revoke
        service: vendor-a-access
        duration:
          value: 0.5
          unit: hours
          provenance: { kind: assumed, reasoning: 'Flag an out-of-hours write and cut one vendor within half an hour (D-075).' }
      - kind: detect-and-revoke
        service: vendor-b-access
        duration:
          value: 0.5
          unit: hours
          provenance: { kind: assumed, reasoning: 'Same monitoring for both vendors (D-076).' }
    assets: [vendor-jump-host]
    capability:
      works: true
      provenance: { kind: assumed, reasoning: 'Not yet tested; the lab will measure detection and revocation (D-007).' }
      measurements: []

scenarios:
  - id: s1-as-reported
    title: Hosted ERP lost (as reported)
    summary: >-
      Based on the Scope Systems incident, Perth, May 2026: hosted ERP customers lost their system
      from 5 May, and Scope restored client servers in stages (about 20% by 10 May, 53% by 12 May,
      80% by 14 May and 100% by 17 May). The model site is placed in the last group, so it waits the
      full 12 days. Manual workarounds hold throughout, and no physical process stops, which matches
      the public record.
    basis: [scope-incident-updates, miningcom-scope-oped]
    projection: false
    workaroundsHold: true
    horizon:
      value: 14
      unit: days
      provenance: { kind: assumed, reasoning: 'The 12-day outage plus two days of recovery (D-078).' }
    events:
      - kind: cut-service
        service: hosted-erp
        at:
          value: 0
          unit: hours
          provenance: { kind: assumed, reasoning: 'The timeline starts at the cut (D-078).' }
        restoreAfter:
          value: 288
          unit: hours
          provenance:
            kind: sourced
            source: scope-incident-updates
            note: 'Disruption from early 5 May 2026; "As of Sunday 17 May, all client servers have been restored". 12 days.'

  - id: s1-projection
    title: 'Hosted ERP lost: what if the workarounds ran out'
    summary: >-
      A projection, not what happened: the same 12-day ERP loss as the Scope Systems incident. The only
      change from the record is that the phone-and-email workarounds run out after a few days instead
      of holding. No real company is shown or implied to have stopped production.
    basis: [scope-incident-updates, mmisac-ref-arch]
    projection: true
    workaroundsHold: false
    horizon:
      value: 16
      unit: days
      provenance: { kind: assumed, reasoning: 'The 12-day outage plus time for the fuel farm to refill past its rationing mark (D-080).' }
    events:
      - kind: cut-service
        service: hosted-erp
        at:
          value: 0
          unit: hours
          provenance: { kind: assumed, reasoning: 'The timeline starts at the cut (D-080).' }
        restoreAfter:
          value: 288
          unit: hours
          provenance:
            kind: sourced
            source: scope-incident-updates
            note: 'Disruption from early 5 May 2026; "As of Sunday 17 May, all client servers have been restored". 12 days.'

  - id: s2-iroc-lost
    title: Perth operations link lost
    summary: >-
      The link to the Perth remote operations centre is lost for a day. Unprepared, the autonomous
      fleet parks and trains slow. Prepared, trained site controllers take over after a short
      handover, as MM-ISAC's fail-local rule asks. The duration is an assumption; no public incident
      gives one.
    basis: [mmisac-ref-arch, rio-tinto-wa-operations]
    projection: false
    workaroundsHold: false
    horizon:
      value: 3
      unit: days
      provenance: { kind: assumed, reasoning: 'The outage plus two days of recovery (D-082).' }
    events:
      - kind: cut-service
        service: iroc-link
