processes:
  # Back office
  - id: diesel-ordering
    name: Diesel ordering
    area: Supply
    kind: back-office
    tier: medium
    safetyFunction: Keeps fuel available for emergency and safety vehicles
    productionConsequence: The fuel farm runs down; the haul fleet slows, then parks
    dependsOn:
      - on: hosted-erp
        onLoss: stop
        manualWorkaround:
          description: Orders placed with the fuel supplier by phone and email, entered later
          holdsFor:
            value: 3
            unit: days
            provenance: { kind: assumed, reasoning: 'How long suppliers keep delivering on emailed orders while invoices and payments cannot be processed (D-041).' }
    status:
      degraded: Fuel orders going by phone and email
      stopped: No fuel orders going out
    continuity:
      maxTolerableOutage:
        value: 120
        unit: hours
        provenance: { kind: assumed, reasoning: 'Seven days of fuel less the two-day rationing mark (D-046).' }
      recoveryTarget:
        value: 48
        unit: hours
        provenance: { kind: assumed, reasoning: 'Leaves margin inside the five tolerable days (D-046).' }
      owner: Supply superintendent
      independentCopy: false

  - id: explosives-ordering
    name: Explosives ordering
    area: Supply
    kind: back-office
    tier: medium
    safetyFunction: Keeps explosives stock accounted for and ordered from licensed suppliers
    productionConsequence: The magazine runs down; blasting stops, then haulage runs out of blasted ore
    dependsOn:
      - on: hosted-erp
        onLoss: stop
        manualWorkaround:
          description: Explosives orders placed by phone and email, entered later
          holdsFor:
            value: 3
            unit: days
            provenance: { kind: assumed, reasoning: 'Same judgement as diesel ordering (D-042).' }
    status:
      degraded: Explosives orders going by phone and email
      stopped: No explosives orders going out
    continuity:
      maxTolerableOutage:
        value: 120
        unit: hours
        provenance: { kind: assumed, reasoning: 'Seven days in the magazine less the two-day low mark (D-047).' }
      recoveryTarget:
        value: 48
        unit: hours
        provenance: { kind: assumed, reasoning: 'Leaves margin inside the five tolerable days (D-047).' }
      owner: Drill and blast superintendent
      independentCopy: false

  - id: work-orders
    name: Maintenance work orders
    area: Maintenance
    kind: back-office
    tier: medium
    safetyFunction: Records isolations, permits and completed safety-critical maintenance
    productionConsequence: Planned maintenance slips; breakdowns take longer to fix
    dependsOn:
      - on: hosted-erp
        onLoss: stop
        manualWorkaround:
          description: Paper job cards for breakdown work
          holdsFor:
            value: 3
            unit: days
            provenance: { kind: assumed, reasoning: 'After a few days planners lose track of planned work, parts and history (D-043).' }
    status:
      degraded: Maintenance running offline
      stopped: Maintenance planning stopped
    continuity:
      maxTolerableOutage:
        value: 72
        unit: hours
        provenance: { kind: assumed, reasoning: 'Matches how long paper job cards hold (D-048).' }
      recoveryTarget:
        value: 24
        unit: hours
        provenance: { kind: assumed, reasoning: 'A day to get planning back (D-048).' }
      owner: Maintenance planning superintendent
      independentCopy: false

  - id: payroll
    name: Payroll
    area: People
    kind: back-office
    tier: low
    safetyFunction: None directly
    productionConsequence: None within weeks; people go unpaid
    dependsOn:
      - on: hosted-erp
        onLoss: stop
        manualWorkaround:
          description: Urgent pay keyed by hand in the bank portal
          holdsFor:
            value: 7
            unit: days
            provenance: { kind: assumed, reasoning: 'One hand-keyed pay run is possible; with fortnightly pay that covers about a week (D-044).' }
    status:
      degraded: Pay run done manually
      stopped: Pay run stalled
    continuity:
      maxTolerableOutage:
        value: 168
        unit: hours
        provenance: { kind: assumed, reasoning: 'The next fortnightly pay day is on average a week away (D-049).' }
      recoveryTarget:
        value: 72
        unit: hours
        provenance: { kind: assumed, reasoning: 'Time to run and check a pay run (D-049).' }
      owner: Payroll manager
      independentCopy: false

  # Control
  - id: remote-operations
    name: Remote operations from Perth
    area: Remote operations centre
    kind: physical
    tier: high
    safetyFunction: Supervises the autonomous haul fleet and controls trains on the network
    productionConsequence: Without it the haul fleet parks and trains slow
    dependsOn:
      - on: iroc-link
        onLoss: stop
    status:
      degraded: Fleet run from the site control room
      stopped: 'Fleet parked: no supervision from Perth'
    continuity:
      maxTolerableOutage:
        value: 4
        unit: hours
        provenance: { kind: assumed, reasoning: 'The fleet parks at once without supervision (D-050).' }
      recoveryTarget:
        value: 2
        unit: hours
        provenance: { kind: assumed, reasoning: 'Matches the site handover time (D-050).' }
      owner: Remote operations centre manager
      independentCopy: false

  - id: control-room
    name: Site control room
    area: Processing plant
    kind: physical
    tier: high
    safetyFunction: Operators run the crushing plant and can stop it safely
    productionConsequence: The crusher stops
    dependsOn:
      - on: control-room-hmi
        onLoss: stop
      - on: cloud-identity
        onLoss: stop
        manualWorkaround:
          description: The current shift stays logged in; the next shift cannot log on
          holdsFor:
            value: 0.5
            unit: days
            provenance: { kind: assumed, reasoning: 'One 12-hour shift already logged in (D-045).' }
    status:
      degraded: Control room running, logins limited
      stopped: Control room locked out
    continuity:
      maxTolerableOutage:
        value: 4
        unit: hours
        provenance: { kind: assumed, reasoning: 'A few hours of lost crushing is absorbed by the stockpile (D-051).' }
      recoveryTarget:
        value: 1
        unit: hours
        provenance: { kind: assumed, reasoning: 'Get operators back on the plant within the hour (D-051).' }
      owner: Processing plant superintendent
      independentCopy: false

  # Mine to rail
  - id: drill-and-blast
    name: Drill and blast
    area: Pit
    kind: physical
    tier: medium
    safetyFunction: Controlled blasting with exclusion zones
    productionConsequence: No new ore is broken; haulage runs on the blasted ore already in the pit
    dependsOn:
      - on: explosives
        onLoss: stop
    status:
      degraded: 'Blasting rationed: explosives low'
      stopped: 'No blasting: magazine empty'
    continuity:
      maxTolerableOutage:
        value: 120
        unit: hours
        provenance: { kind: assumed, reasoning: 'A week of blasted ore less the two-day low mark (D-052).' }
      recoveryTarget:
        value: 48
        unit: hours
        provenance: { kind: assumed, reasoning: 'Leaves margin inside the five tolerable days (D-052).' }
      owner: Drill and blast superintendent
      independentCopy: false

  - id: haulage
    name: Haulage
    area: Pit
    kind: physical
    tier: high
    safetyFunction: Keeps autonomous trucks, crewed vehicles and people apart
    productionConsequence: Ore stops reaching the ROM pad; the crusher runs out within hours
    dependsOn:
      - on: diesel
        onLoss: stop
      - on: broken-ore
        onLoss: stop
      - on: remote-operations
        onLoss: stop
    status:
      degraded: Haul fleet running at a reduced rate
      stopped: Haul fleet parked
    continuity:
      maxTolerableOutage:
        value: 12
        unit: hours
        provenance: { kind: assumed, reasoning: 'The ROM pad holds half a day of crusher feed (D-053).' }
      recoveryTarget:
        value: 4
        unit: hours
        provenance: { kind: assumed, reasoning: 'Back well before the ROM pad empties (D-053).' }
      owner: Mine production superintendent
      independentCopy: false

  - id: crushing
    name: Crushing and conveying
    area: Processing plant
    kind: physical
    tier: high
    safetyFunction: Crusher and conveyor interlocks and emergency stops
    productionConsequence: Nothing reaches the product stockpile; trains start drawing it down
    dependsOn:
      - on: rom-pad
        onLoss: stop
      - on: crusher-plc
        onLoss: stop
      - on: conveyor-plc
        onLoss: stop
      - on: control-room
        onLoss: stop
    status:
      degraded: Crusher running on reduced feed
      stopped: Crusher stopped
    continuity:
      maxTolerableOutage:
        value: 48
        unit: hours
        provenance: { kind: assumed, reasoning: 'Three days on the stockpile less the one-day low mark (D-054).' }
      recoveryTarget:
        value: 12
        unit: hours
        provenance: { kind: assumed, reasoning: 'Back within a shift (D-054).' }
      owner: Processing plant superintendent
      independentCopy: false

  - id: rail
    name: Rail loading and haul to port
    area: Rail
    kind: physical
    tier: high
    safetyFunction: Train control and protection on the network
    productionConsequence: Tonnes are not shipped; production is deferred and revenue is at risk
    dependsOn:
      - on: ore-stockpile
        onLoss: stop
      - on: remote-operations
        onLoss: degrade
    status:
      degraded: Fewer trains running
      stopped: No trains loading
    continuity:
      maxTolerableOutage:
        value: 24
        unit: hours
        provenance: { kind: assumed, reasoning: 'Missed train paths become missed ship loadings within about a day (D-055).' }
      recoveryTarget:
        value: 12
        unit: hours
        provenance: { kind: assumed, reasoning: 'Back within a shift (D-055).' }
      owner: Rail operations manager
      independentCopy: false

